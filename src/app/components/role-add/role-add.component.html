<div class="container mt-5">
   <div class="card-header text-black">
      <h4 class="mb-3">Add New Role</h4>
    </div>
  <div class="card shadow-sm">
   
    <div class="card-body">
      <!-- Role Name Input -->
      <div class="mb-4">
        <label for="roleName" class="form-label fw-semibold">Role Name</label>
        <input
          type="text"
          id="roleName"
          class="form-control"
          [(ngModel)]="roleName"
          placeholder="Enter role name"
        />
      </div>

      <!-- Permissions Table -->
      <div class="table-responsive">
        <table class="table text-center align-middle table-wrapper">
          <thead class="table-light ">
            <tr>
              <th class="text-start">Module Name</th>
              <th>View</th>
              <th>Edit</th>
              <th>Delete</th>
              <th>Add</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let module of modules">
              <td class="text-start">{{ module.name }}</td>
              <td><input type="checkbox" [(ngModel)]="module.permissions.view" /></td>
              <td><input type="checkbox" [(ngModel)]="module.permissions.edit" /></td>
              <td><input type="checkbox" [(ngModel)]="module.permissions.delete" /></td>
              <td><input type="checkbox" [(ngModel)]="module.permissions.add" /></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Save Button -->
      <div class="text-end mt-4">
        <button class="btn save-btn" (click)="saveRole()">
          <i class="bi bi-save me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
