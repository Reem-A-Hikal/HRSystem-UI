<div class="container mt-4">
  <h2>Edit Setting</h2>
  <form [formGroup]="settingForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Type</label>
      <input type="text" formControlName="type" class="form-control" />
    </div>

    <div class="form-group">
      <label>First Holiday</label>
      <input type="number" formControlName="firstHoliday" class="form-control" />
    </div>

    <div class="form-group">
      <label>Second Holiday</label>
      <input type="number" formControlName="secondHoliday" class="form-control" />
    </div>

    <div class="form-group">
      <label>Over Time</label>
      <input type="number" formControlName="overTime" class="form-control" />
    </div>

    <div class="form-group">
      <label>Deduction</label>
      <input type="number" formControlName="deduction" class="form-control" />
    </div>

    <button type="submit" class="btn btn-primary mt-3">Update</button>
  </form>
</div>
