<div class="min-vh-100 d-flex flex-column">
  <main class="main-content flex-grow-1 d-flex justify-content-center">
    <div class="content-container">
      <div *ngIf="setting; else loading">
        <div class="d-flex flex-wrap justify-content-between gap-3 p-3">
          <h2 class="fw-bold mb-0">General Settings Overview</h2>
        </div>
        <div class="card shadow-sm mb-4 border-0 rounded-4">
          <div class="card-body p-4">
            <div class="row mb-4">
              <div class="col-12 col-md-6 mb-3 mb-md-0">
                <div class="text-uppercase text-secondary small mb-2 fw-semibold">
                  Overtime
                </div>
                <div class="fs-5 fw-bold">
                  <ng-container *ngIf="setting.overTime; else noValue">
                    {{ setting.overTime }}
                  </ng-container>
                  <ng-template #noValue>
                    <span class="text-muted fst-italic">No value added</span>
                  </ng-template>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="text-uppercase text-secondary small mb-2 fw-semibold">
                  Deduction
                </div>
                <div class="fs-5 fw-bold">
                  <ng-container *ngIf="setting.deduction; else noValue">
                    {{ setting.deduction }}
                  </ng-container>
                  <ng-template #noValue>
                    <span class="text-muted fst-italic">No value added</span>
                  </ng-template>
                </div>
              </div>
            </div>
            <div class="row mb-4">
              <div class="col-12 col-md-6 mb-3 mb-md-0">
                <div class="text-uppercase text-secondary small mb-2 fw-semibold">
                  Type
                </div>
                <span class="badge bg-gradient fs-6 px-3 py-2 rounded-pill shadow-sm">
                  {{ setting.type | titlecase }}
                </span>
              </div>
              <div class="col-12 col-md-6">
                <div class="text-uppercase text-secondary small mb-2 fw-semibold">
                  Weekly Holidays
                </div>
                <div>
                  <span class="badge-1 text-dark me-2 px-3 py-2 rounded-pill shadow-sm">
                    1: {{ getHolidayName(setting.firstHoliday) }}
                  </span>
                  <span class="badge-1 text-dark px-3 py-2 rounded-pill shadow-sm">
                    2: {{ getHolidayName(setting.secondHoliday) }}
                  </span>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
      <ng-template #loading>
        <div class="text-center p-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </ng-template>
    </div>
  </main>
</div>
