<div class="bg-decoration"></div>

<div class="hr-icons">
  <i class="fas fa-users hr-icon"></i>
  <i class="fas fa-chart-line hr-icon"></i>
  <i class="fas fa-calendar-alt hr-icon"></i>
  <i class="fas fa-briefcase hr-icon"></i>
  <i class="fas fa-user-tie hr-icon"></i>
  <i class="fas fa-clipboard-list hr-icon"></i>
</div>
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="loginContainer m-auto">
    <div class="login-card">
      <div class="company-logo">
        <img class="rounded-3" src="logo.jpg" alt="Company Logo" />
        <div class="content">
          <div class="company-name">Pioneers Solutions</div>
        <div class="company-subtitle">Human Resources Management</div>
        </div>
      </div>

      <h1 class="welcome-title">Welcome Back</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              formControlName="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper password-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              formControlName="password"
              (keyup.enter)="onSubmit()"
              minlength="8"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
            >
              <i
                [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"
                id="toggleIcon"
              ></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">Log in</button>
      </form>
    </div>
  </div>
</div>
