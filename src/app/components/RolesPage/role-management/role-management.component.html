<div *ngIf="authService.hasPermission('Roles-View')" class="d-flex flex-column">
  <main
    style="min-height: 90vh"
    class="main-content flex-grow-1 d-flex justify-content-center"
  >
    <div class="content-container">
      <div class="d-flex flex-wrap flex-column justify-content-between p-3">
        <h1 class="fw-bold mb-0">Role Management</h1>
        <p class="text-muted mb-0">Manage user roles and permissions</p>
      </div>

      <div class="p-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text search-icon">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control search-box"
              placeholder="Search by role name"
              [(ngModel)]="searchTerm"
            />
          </div>
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-end gap-3 p-3 pt-0">
        <a
          *ngIf="authService.hasPermission('Roles-Add')"
          (click)="goToAddPage()"
          class="btn btn-primary fw-bold"
        >
          + Add Role
        </a>
      </div>

      <!-- isLoading -->
      <div
        *ngIf="isLoading"
        class="loading-overlay d-flex flex-column align-items-center justify-content-center p-5"
      >
        <div
          class="spinner-border text-primary mb-3"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="visually-hidden">Loading...</span>
        </div>
        <div class="fw-semibold text-primary fs-5">
          Loading roles records...
        </div>
      </div>

      <div
        *ngIf="!isLoading && !isEmpty"
        class="table-responsive tablecontainer pb-2 mb-4"
      >
        <table class="table table-borderless m-0 align-middle">
          <thead class="d-md-table-header-group text-center">
            <tr>
              <th>Group Name</th>
              <th *ngIf="canShowActionsColumn">Actions</th>
            </tr>
          </thead>
          <tbody style="text-align: center">
            <tr *ngFor="let role of paginatedRoles; let i = index">
              <td data-label="Group Name">{{ role.name }}</td>
              <td *ngIf="canShowActionsColumn" data-label="Actions">
                <div class="fw-bold">
                  <i
                    *ngIf="authService.hasPermission('Roles-Edit')"
                    class="bi bi-pencil-square fs-3 text-primary me-2"
                    title="Edit"
                    (click)="editRole(i)"
                  ></i>
                  <i
                    *ngIf="authService.hasPermission('Roles-Delete')"
                    class="bi bi-trash fs-3 text-danger"
                    title="Delete"
                    (click)="deleteRole(i)"
                  ></i>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <div class="d-flex justify-content-center mt-4 flex-wrap gap-2">
          <button
            class="pagination-btn"
            [disabled]="currentPage === 1"
            (click)="goToPage(currentPage - 1)"
          >
            ‹
          </button>

          <button
            *ngFor="let page of totalPages"
            (click)="goToPage(page)"
            [ngClass]="{ 'active-page': currentPage === page }"
            class="pagination-btn"
          >
            {{ page }}
          </button>

          <button
            class="pagination-btn"
            [disabled]="currentPage === totalPages.length"
            (click)="goToPage(currentPage + 1)"
          >
            ›
          </button>
        </div>
      </div>
      <!-- No Matching -->
      <div
        *ngIf="!isLoading && isEmpty"
        class="empty-table-message text-center p-5 mb-3"
      >
        <i class="bi bi-people-fill fs-1 text-muted"></i>
        <h4 class="mt-3">No Record Found</h4>
        <p class="text-muted">There are currently no records to display.</p>
      </div>
    </div>
  </main>
</div>
