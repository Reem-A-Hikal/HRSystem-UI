<div class="main-container">
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">Role Management</h1>
    <p class="text-muted mb-0">Manage user roles and permissions</p>
  </div>

  <!-- Form Container -->
  <div class="form-container">
    <!-- Form Header -->
    <div class="form-header">
      <h4 class="text-center" id="formTitle">{{ isEditing ? "Edit Role" : "Add New Role" }}</h4>
    </div>

    <!-- Form Body -->
    <div class="form-body">
      <!-- Role Name Input -->
      <div class="mb-4">
        <label for="roleName" class="form-label">Role Name</label>
        <input
          type="text"
          id="roleName"
          class="form-control"
          [(ngModel)]="roleName"
          placeholder="Enter role name"
        />
      </div>

      <!-- Permissions Section -->
      <div class="permissions-section">
        <h5 class="section-title">
          <i class="bi bi-shield-lock icon-spacing"></i>
          Module Permissions
        </h5>

        <div class="table-container">
          <table class="table permissions-table text-center align-middle">
            <thead>
              <tr>
                <th class="text-start">Module Name</th>
                <th>View</th>
                <th>Edit</th>
                <th>Delete</th>
                <th>Add</th>
              </tr>
            </thead>
            <tbody id="permissionsTableBody">
              <tr *ngFor="let module of modules">
              <td class="text-start">{{ module.name }}</td>
              <td>
                <input
                  type="checkbox"
                  [(ngModel)]="module.permissions.view"
                  title="View permission for {{ module.name }}"
                  [attr.aria-label]="'View permission for ' + module.name"
                  placeholder="View"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  [(ngModel)]="module.permissions.edit"
                  title="Edit permission for {{ module.name }}"
                  [attr.aria-label]="'Edit permission for ' + module.name"
                  placeholder="Edit"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  [(ngModel)]="module.permissions.delete"
                  title="Delete permission for {{ module.name }}"
                  [attr.aria-label]="'Delete permission for ' + module.name"
                  placeholder="Delete"
                />
              </td>
              <td>
                <input
                  type="checkbox"
                  [(ngModel)]="module.permissions.add"
                  title="Add permission for {{ module.name }}"
                  [attr.aria-label]="'Add permission for ' + module.name"
                  placeholder="Add"
                />
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-container text-end">
        <button class="btn cancel-btn" (click)="cancelForm()">
          <i class="bi bi-x-circle icon-spacing"></i>Cancel
        </button>
        <button class="btn save-btn" (click)="saveRole()">
          <i class="bi bi-save me-2"></i>{{ isEditing ? "Update" : "Save" }}
        </button>
      </div>
    </div>
  </div>
</div>
