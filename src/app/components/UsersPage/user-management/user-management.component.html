<div class="first" *ngIf="authService.hasPermission('Users-View')">
  <main class="main-content flex-grow-1 d-flex justify-content-center">
    <div class="content-container">
      <div class="d-flex flex-wrap justify-content-between gap-3 p-3">
        <h1 class="fw-bold">User Management</h1>
      </div>

      <div class="p-3">
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text search-icon">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control search-box"
              placeholder="Search by User name"
              [(ngModel)]="searchTerm"
            />
          </div>
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-end gap-3 p-3 pt-0">
        <a
          *ngIf="authService.hasPermission('Users-Add')"
          [routerLink]="['/dashboard/Users/add-user']"
          class="btn btn-primary fw-bold"
        >
          + Add User
        </a>
      </div>

      <!-- Table -->
      @if (!isEmpty && !isLoading) {
      <div class="table-responsive tablecontainer p-0 mb-4">
        <table class="table table-borderless m-0 align-middle">
          <thead class="d-md-table-header-group text-center">
            <tr>
              <th>Full Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role Name</th>
              <th *ngIf="canShowActionsColumn">Actions</th>
            </tr>
          </thead>
          <tbody class="text-center">
            <tr *ngFor="let user of paginatedUsers">
              <td data-label="Full Name">{{ user.fullName }}</td>
              <td data-label="Username">{{ user.userName }}</td>
              <td data-label="E-mail">{{ user.email }}</td>
              <td data-label="Roles">{{ user.roles?.[0] }}</td>
               <td *ngIf="canShowActionsColumn" data-label="Actions" class="actions-col">
                <div>
                  <i *ngIf="authService.hasPermission('Users-Edit')" class="bi bi-pencil-square fs-3 text-primary p-0" title="Edit" (click)="editUser(user)"></i>
                  <i *ngIf="authService.hasPermission('Users-Delete')" class="bi bi-trash fs-3 text-danger p-0" title="Delete" (click)="deleteUser(user)"></i>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      }
      <!-- isLoading -->
      <div
        *ngIf="isLoading"
        class="loading-overlay d-flex flex-column align-items-center justify-content-center p-5"
      >
        <div
          class="spinner-border text-primary mb-3"
          style="width: 3rem; height: 3rem"
          role="status"
        >
          <span class="visually-hidden">Loading...</span>
        </div>
        <div class="fw-semibold text-primary fs-5">
          Loading employee records...
        </div>
      </div>
      <div
        *ngIf="!isLoading && isEmpty"
        class="empty-table-message text-center p-5 mb-3"
      >
        <i class="bi bi-people-fill fs-1 text-muted"></i>
        <h4 class="mt-3">No Record Found</h4>
        <p class="text-muted">There are currently no records to display.</p>
      </div>

      <!-- Pagination -->

      <div *ngIf="!isEmpty" class="d-flex justify-content-center mt-4 flex-wrap gap-2">
        <button
          class="pagination-btn"
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
        >
          ‹
        </button>

        <button
          *ngFor="let page of totalPages"
          (click)="goToPage(page)"
          [ngClass]="{ 'active-page': currentPage === page }"
          class="pagination-btn"
        >
          {{ page }}
        </button>

        <button
          class="pagination-btn"
          [disabled]="currentPage === totalPages.length"
          (click)="goToPage(currentPage + 1)"
        >
          ›
        </button>
      </div>

      <!-- Add User Button -->
    </div>
  </main>
</div>
