<div *ngIf="authService.hasPermission('OfficialHoliday-Edit')" class="container-fluid min-vh-100 d-flex flex-column">
      <!-- Main Content -->
      <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-4">
              <h1 class="fs-2 fw-bold mb-0">Edit Official Holiday</h1>
            </div>
            <form (ngSubmit)="saveChanges()" #editForm="ngForm">
              <div class="mb-3">
                <label for="holidayName" class="form-label">Holiday Name</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="holidayName"
                  placeholder="e.g. Independence Day"
                  [(ngModel)]="holiday.name"
                  name="holidayName"
                  required
                />
              </div>
              <div class="mb-4">
                <label for="holidayDate" class="form-label">Date</label>
                <input
                  type="date"
                  class="form-control form-control-lg"
                  id="holidayDate"
                  [(ngModel)]="holiday.date"
                  name="holidayDate"
                  required
                />
              </div>
              <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary fw-bold px-4">
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
