<div class="main-container py-5 px-4">
  <div class="container">
    <!-- Page Title -->
    <h3 class="page-title mb-4">Employee Details</h3>

    <!-- Search and Add Row -->
    <div
      class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"
    >
      <!-- Search -->
      <div class="search-container">
        <i class="bi bi-search"></i>
        <input
          type="text"
          class="form-control search-input"
          placeholder="Search employee..."
          [(ngModel)]="searchTerm"
        />
      </div>

      <!-- Add Button -->
      <button
        (click)="goToAddPage()"
        class="btn add-btn rounded-pill px-4 py-2"
      >
        <i class="bi bi-plus-circle me-2"></i> Add Employee
      </button>
    </div>

    <!-- Table -->
    <div
      class="table-responsive shadow-sm rounded bg-white border table-container"
    >
      <table class="table table-hover align-middle text-center">
        <thead class="table-header text-white">
          <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Base Salary</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Gender</th>
            <th>Nationality</th>
            <th>National ID</th>
            <th>DOB</th>
            <th>Contract</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let emp of pagedEmployees; let i = index">
            <td>{{ emp.name }}</td>
            <td>{{ emp.department }}</td>
            <td>{{ emp.salary }}</td>
            <td>{{ emp.address }}</td>
            <td>{{ emp.phone }}</td>
            <td>{{ emp.gender }}</td>
            <td>{{ emp.nationality }}</td>
            <td>{{ emp.nationalId }}</td>
            <td>{{ emp.dob }}</td>
            <td>{{ emp.contractDate }}</td>
            <td>
              <button
                class="btn btn-sm icon-btn edit-btn me-1"
                (click)="editEmployee(i)"
              >
                <i class="bi bi-pencil"></i>
              </button>
              <button
                class="btn btn-sm icon-btn delete-btn"
                (click)="deleteEmployee(i)"
              >
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4 flex-wrap gap-2">
      <button
        class="pagination-btn"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >
        ‹
      </button>

      <button
        *ngFor="let page of totalPages"
        (click)="goToPage(page)"
        [ngClass]="{ 'active-page': currentPage === page }"
        class="pagination-btn"
      >
        {{ page }}
      </button>

      <button
        class="pagination-btn"
        [disabled]="currentPage === totalPages.length"
        (click)="goToPage(currentPage + 1)"
      >
        ›
      </button>
    </div>
  </div>
</div>
