<div
  class="sidenav"
  [ngClass]="isLeftSidebarCollapsed() ? 'sidenav-collapsed' : ''"
>
  <div class="logo-container">
    <button class="logo" (click)="toggleCollapse()">
      <i class="bi bi-bars">HR</i>
    </button>
    @if (!isLeftSidebarCollapsed()) {
    <div class="logo-text" @fadeInOut>Pioneers</div>
    <button @rotate class="btn-close" (click)="closeSidenav()"></button>
    }
  </div>
  <div class="sidenav-nav">
    @for (item of items; track $index) {
    <li class="sidenav-nav-item">
      <a
        class="sidenav-nav-link"
        [routerLink]="item.routeLink"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="sidenav-link-icon" [class]="item.icon"></i>
        @if (!isLeftSidebarCollapsed()) {
        <span @fadeInOut class="sidenav-link-text">{{ item.label }}</span>
        }
      </a>
    </li>
    }
    <li
      class="sidenav-nav-item logout-item"
      style="margin-top: auto; display: flex"
    >
      <a
        class="sidenav-nav-link"
        (click)="onLogout()"
        tabindex="0"
        aria-label="Logout"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        style="flex: 1"
      >
        <i class="sidenav-link-icon bi bi-box-arrow-left"></i>
        @if (!isLeftSidebarCollapsed()) {
        <span @fadeInOut class="sidenav-link-text">Logout</span>
        }
      </a>
    </li>
  </div>
</div>
